name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - run: node scripts/check-go-format.mjs
      - run: go test ./...
      - run: go test -race ./...
      - run: make fuzz FUZZTIME=5s
      - run: go vet ./...
      - run: go build ./...

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - run: make setup
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: make build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:control
      - run: pnpm test:database
      - run: pnpm test:database-control
      - run: pnpm test:fleet-api
      - run: pnpm test:fleet
      - run: pnpm test:domains-api
      - run: pnpm test:domains
      - run: pnpm test:observability
      - run: pnpm test:security
      - run: pnpm test:load
      - run: pnpm test:chaos
      - run: pnpm test:dashboard
      - run: pnpm test:bootstrap
