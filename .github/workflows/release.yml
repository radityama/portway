name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate without publishing a release
        required: true
        default: v0.0.0-validation
        type: string

permissions:
  contents: read

jobs:
  binaries:
    needs: native-installers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PORTWAY_RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - run: make setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: make check
      - run: make fuzz FUZZTIME=5s
      - run: pnpm test:bootstrap
      - run: pnpm test:release-container
      - run: pnpm test:deployment
      - name: Build exact reviewed source
        run: node scripts/release.mjs --version "$PORTWAY_RELEASE_VERSION"
      - uses: actions/attest-build-provenance@v2
        if: github.event_name == 'push'
        with:
          subject-path: dist/releases/${{ env.PORTWAY_RELEASE_VERSION }}/*
      - uses: actions/upload-artifact@v4
        with:
          name: portway-${{ env.PORTWAY_RELEASE_VERSION }}
          path: dist/releases/${{ env.PORTWAY_RELEASE_VERSION }}/*
          if-no-files-found: error
      - name: Create reviewable draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$PORTWAY_RELEASE_VERSION" dist/releases/"$PORTWAY_RELEASE_VERSION"/* --verify-tag --draft --generate-notes --title "Portway $PORTWAY_RELEASE_VERSION"

  native-installers:
    uses: ./.github/workflows/native-installers.yml
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
