# Replace hosts/certificate paths and relay source ranges before use.
# This file belongs inside nginx's http block. Public tunnel TLS is served by
# the relay on its separate edge host, outside this metadata ingress.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}
server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/portway/ingress-cert.pem;
    ssl_certificate_key /etc/portway/ingress-key.pem;
    ssl_protocols TLSv1.3;
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    location /internal/ {
        allow 127.0.0.1;
        allow ::1;
        # allow <reviewed relay source IP/CIDR>;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
    location = /metrics { allow 127.0.0.1; allow ::1; deny all; proxy_pass http://127.0.0.1:8080; }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host api.example.com;
    }
}
server {
    listen 443 ssl;
    server_name console.example.com;
    ssl_certificate /etc/portway/ingress-cert.pem;
    ssl_certificate_key /etc/portway/ingress-key.pem;
    ssl_protocols TLSv1.3;
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host console.example.com;
    }
}
