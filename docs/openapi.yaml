openapi: 3.1.0
info:
  title: Portway Control Plane API
  version: 1.0.0
  description: >-
    Control-plane API derived from docs/API.md. Phase 9 implements authentication,
    scoped projects/tunnels, configured relay metadata and credential issuance in
    PostgreSQL by default (explicit bounded memory mode is available for tests).
    Durable state and revocation survive API restart. Phase 12 implements scoped domains
    and DNS ownership verification; logs/metrics remain later work. Phase 13 consumes
    these contracts through a browser dashboard adapter described in API.md; its
    browser-local routes are outside this control-plane base.
    Database admission/transaction failures return 503 STORAGE_UNAVAILABLE. Phase 11
    requires fresh HEALTHY Redis reports and capacity headroom for relay assignments;
    Redis failure returns 503 PRESENCE_UNAVAILABLE. Relay-scoped report/drain routes
    fence stale incarnations and keep application traffic local to its assigned relay.
    JSON bodies are at most 64 KiB. Global 429/503/413 error envelopes apply.
    Secret-bearing responses use Cache-Control no-store and are not replay-cached.
    This contract manages metadata; it does not carry public application traffic.
servers:
  - url: https://api.portway.example.com/api/v1
  - url: http://localhost:8080/api/v1

tags:
  - name: Auth
  - name: Projects
  - name: Tunnels
  - name: Domains
  - name: Relays
  - name: Logs
  - name: Metrics

paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          $ref: '#/components/responses/SessionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /me:
    get:
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          $ref: '#/components/responses/MeResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /projects:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          $ref: '#/components/responses/ProjectListResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '201':
          $ref: '#/components/responses/ProjectResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          $ref: '#/components/responses/ProjectResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '204':
          description: Project deleted according to lifecycle policy.
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /tunnels:
    get:
      tags: [Tunnels]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/TunnelStatus' }
        - in: query
          name: relayId
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          $ref: '#/components/responses/TunnelListResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Tunnels]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTunnelRequest'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '201':
          $ref: '#/components/responses/TunnelResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /tunnels/{tunnelId}:
    parameters:
      - $ref: '#/components/parameters/TunnelId'
    get:
      tags: [Tunnels]
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          $ref: '#/components/responses/TunnelResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Tunnels]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '204':
          description: Tunnel deleted or transitioned to its terminal lifecycle state.
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /tunnels/{tunnelId}/revoke:
    post:
      tags: [Tunnels]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TunnelId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          $ref: '#/components/responses/TunnelResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /tunnels/{tunnelId}/connect:
    post:
      tags: [Tunnels]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TunnelId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectRequest' }
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          $ref: '#/components/responses/ConnectResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'

  /domains:
    get:
      tags:
        - Domains
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: tunnelId
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DomainListResponse'
        default: &id001
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
        - Domains
      description: Reserve a scoped canonical hostname and return its one-time 24h DNS TXT proof. Keyed retries do not replay proof.
      security:
        - bearerAuth: []
      responses:
        default: *id001
        '201':
          $ref: '#/components/responses/DomainChallengeResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomainRequest'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
  /domains/{domainId}:
    parameters:
      - $ref: '#/components/parameters/DomainId'
    get:
      tags:
        - Domains
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/DomainResponse'
        default: *id001
    delete:
      tags:
        - Domains
      description: Disable alias; retain hostname reservation and audit.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: &id002
              type: object
              additionalProperties: false
      responses:
        '204':
          description: Domain disabled.
        default: *id001
  /domains/{domainId}/challenge:
    parameters:
      - $ref: '#/components/parameters/DomainId'
    post:
      tags:
        - Domains
      description: Rotate one-time proof, removing active routing.
      security:
        - bearerAuth: []
      responses:
        default: *id001
        '200':
          $ref: '#/components/responses/DomainChallengeResponse'
      requestBody:
        required: false
        content:
          application/json:
            schema: *id002
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
  /domains/{domainId}/verify:
    parameters:
      - $ref: '#/components/parameters/DomainId'
    post:
      tags:
        - Domains
      description: Resolve bounded DNS TXT outside transactions and recheck proof before commit.
      security:
        - bearerAuth: []
      responses:
        default: *id001
        '200':
          $ref: '#/components/responses/DomainResponse'
      requestBody:
        required: false
        content:
          application/json:
            schema: *id002
  /domains/{domainId}/activate:
    parameters:
      - $ref: '#/components/parameters/DomainId'
    post:
      tags:
        - Domains
      description: Enable verified alias policy; operator must provision matching valid TLS certificate.
      security:
        - bearerAuth: []
      responses:
        default: *id001
        '200':
          $ref: '#/components/responses/DomainResponse'
      requestBody:
        required: false
        content:
          application/json:
            schema: *id002
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'

  /relays:
    get:
      tags: [Relays]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          $ref: '#/components/responses/RelayListResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /relays/{relayId}:
    parameters:
      - $ref: '#/components/parameters/RelayId'
    get:
      tags: [Relays]
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          $ref: '#/components/responses/RelayResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /tunnels/{tunnelId}/logs:
    get:
      tags: [Logs]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TunnelId'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/LogListResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /tunnels/{tunnelId}/metrics:
    get:
      tags: [Metrics]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TunnelId'
      responses:
        '200':
          $ref: '#/components/responses/MetricsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /internal/credentials/verify:
    post:
      tags: [Auth]
      description: Relay AUTH-only verification; never used by public request forwarding. Relay credential is scoped to relayId; raw tunnel tokens are not sent here. Superseded relay/generation assignments return AUTH_REVOKED; admitted local leases remain usable until replacement or expiry.
      security:
        - relayAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tokenHash, relayId]
              properties:
                tokenHash: { type: string, pattern: '^[a-f0-9]{64}$' }
                relayId: { type: string }
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Verified tunnel and generation binding.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [tunnelId, generation, expiresAt]
                        properties:
                          tunnelId: { type: string }
                          generation:
                            { type: string, pattern: '^[1-9][0-9]{0,19}$' }
                          expiresAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'

  /internal/relays/{relayId}/register:
    post:
      tags:
        - Relays
      description:
        Relay-scoped register. Live state uses 15s Redis report leases; durable
        operator policy remains in PostgreSQL.
      security:
        - relayAuth: []
      parameters:
        - $ref: '#/components/parameters/RelayId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayRegister'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Relay acknowledgement
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RelayReportAck'
  /internal/relays/{relayId}/report:
    post:
      tags:
        - Relays
      description:
        Relay-scoped report. Live state uses 15s Redis report leases; durable
        operator policy remains in PostgreSQL.
      security:
        - relayAuth: []
      parameters:
        - $ref: '#/components/parameters/RelayId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayReport'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Relay acknowledgement
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RelayReportAck'
  /internal/relays/{relayId}/drain:
    post:
      tags:
        - Relays
      description:
        Relay-scoped drain. Live state uses 15s Redis report leases; durable
        operator policy remains in PostgreSQL.
      security:
        - relayAuth: []
      parameters:
        - $ref: '#/components/parameters/RelayId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Relay acknowledgement
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          relay:
                            $ref: '#/components/schemas/Relay'
  /internal/relays/{relayId}/activate:
    post:
      tags:
        - Relays
      description:
        Relay-scoped activate. Live state uses 15s Redis report leases; durable
        operator policy remains in PostgreSQL.
      security:
        - relayAuth: []
      parameters:
        - $ref: '#/components/parameters/RelayId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Relay acknowledgement
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          relay:
                            $ref: '#/components/schemas/Relay'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    relayAuth:
      type: http
      scheme: bearer
      description: Separate operator-provisioned relay verification credential.

  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string }
    TunnelId:
      in: path
      name: tunnelId
      required: true
      schema: { type: string }
    DomainId:
      in: path
      name: domainId
      required: true
      schema: { type: string }
    RelayId:
      in: path
      name: relayId
      required: true
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 255
    Cursor:
      in: query
      name: cursor
      required: false
      schema: { type: string }
    Limit:
      in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  schemas:
    Envelope:
      type: object
      required: [data, error, meta]
      properties:
        data: {}
        error:
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/ApiError'
        meta:
          type: object
          additionalProperties: true

    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Session:
      type: object
      required: [accessToken, expiresAt]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }

    Project:
      type: object
      required: [id, organizationId, name, slug, createdAt, updatedAt]
      properties:
        id: { type: string }
        organizationId: { type: string }
        name: { type: string }
        slug: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TunnelStatus:
      type: string
      enum: [CREATED, CONNECTING, CONNECTED, DISCONNECTED, DRAINING, REVOKED]

    TunnelType:
      type: string
      enum: [EPHEMERAL, PERSISTENT]

    Tunnel:
      type: object
      required:
        [
          id,
          projectId,
          name,
          slug,
          type,
          status,
          protocol,
          localHost,
          generation,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        slug: { type: string }
        type: { $ref: '#/components/schemas/TunnelType' }
        status: { $ref: '#/components/schemas/TunnelStatus' }
        protocol: { type: string, enum: [http] }
        localHost: { type: string }
        localPort: { type: integer, nullable: true, minimum: 1, maximum: 65535 }
        publicHostname: { type: string, nullable: true }
        relayId: { type: string, nullable: true }
        generation: { type: string, pattern: '^[1-9][0-9]{0,19}$|^0$' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastConnectedAt: { type: string, format: date-time, nullable: true }

    TunnelCredential:
      type: object
      required: [id, tunnelId, scope, issuedAt]
      properties:
        id: { type: string }
        tunnelId: { type: string }
        scope: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }

    Domain:
      type: object
      required: [id, hostname, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        tunnelId: { type: string, nullable: true }
        hostname: { type: string }
        status:
          type: string
          enum: [PENDING_VERIFICATION, VERIFIED, ACTIVE, DISABLED]
        verificationExpiresAt:
          { type: string, format: date-time, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Relay:
      type: object
      required: [id, name, region, hostname, port, protocol, status]
      properties:
        id: { type: string }
        name: { type: string }
        region: { type: string }
        hostname: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        protocol: { type: string }
        status:
          type: string
          enum: [HEALTHY, DEGRADED, DRAINING, OFFLINE]
        capacity:
          allOf: [{ $ref: '#/components/schemas/RelayCapacity' }]
          nullable: true
        lastSeenAt: { type: string, format: date-time, nullable: true }

    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug:
          { type: string, maxLength: 63, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }

    CreateTunnelRequest:
      type: object
      additionalProperties: false
      required: [projectId, name, type, protocol, localHost, localPort]
      properties:
        projectId: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        slug:
          { type: string, maxLength: 63, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        type: { $ref: '#/components/schemas/TunnelType' }
        protocol: { type: string, enum: [http] }
        localHost:
          { type: string, description: Numeric IPv4 or IPv6 loopback address. }
        localPort: { type: integer, minimum: 1, maximum: 65535 }

    CreateDomainRequest:
      type: object
      additionalProperties: false
      required: [hostname, tunnelId]
      properties:
        hostname: { type: string, maxLength: 220 }
        tunnelId: { type: string }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 512, writeOnly: true }
      description: Phase 9 exchanges a provisioned API key for a one-hour bounded session. OAuth/device flow remains later work.

    IssuedTunnelCredential:
      allOf:
        - $ref: '#/components/schemas/TunnelCredential'
        - type: object
          required: [token, expiresAt]
          properties:
            expiresAt: { type: string, format: date-time }
            token: { type: string, minLength: 32, maxLength: 512 }

    ConnectRequest:
      type: object
      additionalProperties: false
      properties:
        avoidRelayId:
          { type: string, maxLength: 128, pattern: '^[a-zA-Z0-9_-]+$' }
        minimumGeneration: { type: string, pattern: '^[1-9][0-9]{0,19}$' }

    ConnectAssignment:
      type: object
      required: [relay, credential, generation, publicHostname]
      properties:
        generation: { type: string, pattern: '^[1-9][0-9]{0,19}$' }
        publicHostname: { type: string }
        relay: { $ref: '#/components/schemas/Relay' }
        credential: { $ref: '#/components/schemas/IssuedTunnelCredential' }

    RequestLog:
      type: object
      required:
        [timestamp, method, host, path, status, durationMs, bytesIn, bytesOut]
      properties:
        timestamp: { type: string, format: date-time }
        method: { type: string }
        host: { type: string }
        path: { type: string }
        status: { type: integer }
        durationMs: { type: integer, minimum: 0 }
        bytesIn: { type: integer, format: int64, minimum: 0 }
        bytesOut: { type: integer, format: int64, minimum: 0 }

    TunnelMetrics:
      type: object
      properties:
        activeStreams: { type: integer, minimum: 0 }
        requests: { type: integer, format: int64, minimum: 0 }
        bytesIn: { type: integer, format: int64, minimum: 0 }
        bytesOut: { type: integer, format: int64, minimum: 0 }
        p95LatencyMs: { type: number, minimum: 0 }
        p99LatencyMs: { type: number, minimum: 0 }

    RelayCapacity:
      type: object
      additionalProperties: false
      required:
        - activeConnections
        - activeTunnels
        - retainedTunnels
        - activeStreams
        - maxConnections
        - maxTunnels
        - maxStreams
      properties:
        activeConnections:
          type: integer
          minimum: 0
          maximum: 10000
        activeTunnels:
          type: integer
          minimum: 0
          maximum: 10000
        retainedTunnels:
          type: integer
          minimum: 0
          maximum: 100000
        activeStreams:
          type: integer
          minimum: 0
          maximum: 10240000
        maxConnections:
          type: integer
          minimum: 1
          maximum: 10000
        maxTunnels:
          type: integer
          minimum: 1
          maximum: 100000
        maxStreams:
          type: integer
          minimum: 1
          maximum: 1024
    RelayRegister:
      type: object
      additionalProperties: false
      required:
        - activeConnections
        - activeTunnels
        - retainedTunnels
        - activeStreams
        - maxConnections
        - maxTunnels
        - maxStreams
        - instanceId
        - status
      properties:
        activeConnections:
          type: integer
          minimum: 0
          maximum: 10000
        activeTunnels:
          type: integer
          minimum: 0
          maximum: 10000
        retainedTunnels:
          type: integer
          minimum: 0
          maximum: 100000
        activeStreams:
          type: integer
          minimum: 0
          maximum: 10240000
        maxConnections:
          type: integer
          minimum: 1
          maximum: 10000
        maxTunnels:
          type: integer
          minimum: 1
          maximum: 100000
        maxStreams:
          type: integer
          minimum: 1
          maximum: 1024
        instanceId:
          type: string
          pattern: ^[a-f0-9]{32}$
        status:
          type: string
          enum:
            - HEALTHY
            - DEGRADED
            - DRAINING
    RelayReport:
      type: object
      additionalProperties: false
      required:
        - activeConnections
        - activeTunnels
        - retainedTunnels
        - activeStreams
        - maxConnections
        - maxTunnels
        - maxStreams
        - instanceId
        - status
        - leaseId
        - sequence
      properties:
        activeConnections:
          type: integer
          minimum: 0
          maximum: 10000
        activeTunnels:
          type: integer
          minimum: 0
          maximum: 10000
        retainedTunnels:
          type: integer
          minimum: 0
          maximum: 100000
        activeStreams:
          type: integer
          minimum: 0
          maximum: 10240000
        maxConnections:
          type: integer
          minimum: 1
          maximum: 10000
        maxTunnels:
          type: integer
          minimum: 1
          maximum: 100000
        maxStreams:
          type: integer
          minimum: 1
          maximum: 1024
        instanceId:
          type: string
          pattern: ^[a-f0-9]{32}$
        status:
          type: string
          enum:
            - HEALTHY
            - DEGRADED
            - DRAINING
        leaseId:
          type: string
          pattern: ^[a-f0-9]{32}$
        sequence:
          type: integer
          minimum: 1
          maximum: 2147483647
    RelayReportAck:
      type: object
      additionalProperties: false
      required:
        - relayId
        - instanceId
        - leaseId
        - sequence
        - expiresAt
        - drainRequested
      properties:
        relayId:
          type: string
        instanceId:
          type: string
          pattern: ^[a-f0-9]{32}$
        leaseId:
          type: string
          pattern: ^[a-f0-9]{32}$
        sequence:
          type: integer
          minimum: 0
          maximum: 2147483647
        expiresAt:
          type: string
          format: date-time
        drainRequested:
          type: boolean
        routes:
          type: array
          maxItems: 128
          items: { $ref: '#/components/schemas/DomainRoute' }

    DomainRoute:
      type: object
      additionalProperties: false
      required: [hostname, tunnelId, generation, expiresAt]
      properties:
        hostname: { type: string, maxLength: 220 }
        tunnelId: { type: string }
        generation: { type: string, pattern: '^[1-9][0-9]{0,19}$' }
        expiresAt: { type: string, format: date-time }

  responses:
    DomainChallengeResponse:
      description: Scoped domain and one-time DNS TXT proof. No raw proof retained for idempotency replay.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [domain, verification]
                    properties:
                      domain: { $ref: '#/components/schemas/Domain' }
                      verification:
                        type: object
                        required: [type, name, value]
                        properties:
                          type: { type: string, enum: [TXT] }
                          name: { type: string }
                          value: { type: string }

    ErrorResponse:
      description: API error.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { type: 'null' }
                  error: { $ref: '#/components/schemas/ApiError' }

    SessionResponse:
      description: Authenticated session.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      session: { $ref: '#/components/schemas/Session' }

    MeResponse:
      description: Current user, organization and membership role.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      organization:
                        type: object
                        required: [id, name, slug]
                        properties:
                          id: { type: string }
                          name: { type: string }
                          slug: { type: string }
                      role:
                        { type: string, enum: [OWNER, ADMIN, MEMBER, VIEWER] }

    ProjectResponse:
      description: Project response.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      project: { $ref: '#/components/schemas/Project' }

    ProjectListResponse:
      description: Project list.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      projects:
                        type: array
                        items: { $ref: '#/components/schemas/Project' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Envelope/properties/meta'

    TunnelResponse:
      description: Tunnel response.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      tunnel: { $ref: '#/components/schemas/Tunnel' }

    TunnelListResponse:
      description: Tunnel list.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      tunnels:
                        type: array
                        items: { $ref: '#/components/schemas/Tunnel' }
                  meta:
                    type: object
                    properties:
                      nextCursor: { type: string, nullable: true }
                    additionalProperties: true

    ConnectResponse:
      description: Relay, reserved generation, hostname and one-time short-lived credential. Cache-Control no-store. Exact secret-bearing idempotency replay returns CREDENTIAL_ALREADY_ISSUED.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ConnectAssignment' }

    DomainResponse:
      description: Domain response.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      domain: { $ref: '#/components/schemas/Domain' }

    DomainListResponse:
      description: Domain list.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      domains:
                        type: array
                        items: { $ref: '#/components/schemas/Domain' }
                  meta:
                    type: object
                    properties:
                      nextCursor: { type: string, nullable: true }
                    additionalProperties: true

    RelayResponse:
      description: Relay detail.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      relay: { $ref: '#/components/schemas/Relay' }

    RelayListResponse:
      description: Relay list.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      relays:
                        type: array
                        items: { $ref: '#/components/schemas/Relay' }
                  meta:
                    type: object
                    properties:
                      nextCursor: { type: string, nullable: true }
                    additionalProperties: true

    LogListResponse:
      description: Metadata-level request logs with sensitive fields redacted.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items: { $ref: '#/components/schemas/RequestLog' }
                  meta:
                    type: object
                    properties:
                      nextCursor: { type: string, nullable: true }
                    additionalProperties: true

    MetricsResponse:
      description: Aggregated dashboard-friendly tunnel metrics.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      metrics: { $ref: '#/components/schemas/TunnelMetrics' }
